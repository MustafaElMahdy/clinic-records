# Render blueprint for DocuMed.
#
# Database: DocuMed runs on Supabase Postgres (Session Pooler / IPv4), NOT a
# Render database. DATABASE_URL is a secret set in the Render dashboard, so it's
# marked `sync: false` here (the blueprint never holds the connection string).
#
# Secrets (DATABASE_URL, SECRET_KEY, EMAIL_*, R2 keys, SENTRY_DSN, INSTAPAY_*)
# are managed in the dashboard and shown here as `sync: false` so the IaC lists
# every var the app needs without committing any secret values. Plain `value:`
# entries are non-sensitive config and are the source of truth.

services:
  - type: web
    name: documed
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py compilemessages && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,www.documed.health,documed.health"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://clinic-records.onrender.com,https://www.documed.health,https://documed.health"
      - key: SITE_URL
        value: "https://documed.health"
      - key: MONTHLY_PRICE_EGP
        value: "1500"
      # ── Secrets (set in dashboard) ──
      - key: DATABASE_URL
        sync: false   # Supabase Session Pooler URL
      - key: SENTRY_DSN
        sync: false
      # Email (Resend over SMTP)
      - key: EMAIL_BACKEND
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Billing
      - key: INSTAPAY_ADDRESS
        sync: false
      - key: PAYMENT_NOTIFICATION_EMAIL
        sync: false
      # Cloudflare R2 media storage
      - key: R2_BUCKET_NAME
        value: "documed-media"
      - key: R2_ACCOUNT_ID
        value: "8bbcd32aedca41ce63e50d2c581b7794"
      - key: R2_ENDPOINT_URL
        value: "https://8bbcd32aedca41ce63e50d2c581b7794.r2.cloudflarestorage.com"
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

  # Daily renewal-reminder emails (3 days before + on the day access ends).
  # 07:00 UTC ≈ 09:00 in Egypt (UTC+2). Adjust if Egypt is on DST (UTC+3).
  # Shares the web service's DB + email config; the secret values below must be
  # set to the SAME values in this cron job's dashboard env (an Env Group is the
  # easiest way to keep them in sync).
  - type: cron
    name: documed-renewal-reminders
    runtime: python
    schedule: "0 7 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py send_renewal_reminders
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true   # cron does no cross-service signing; own key is fine
      - key: SITE_URL
        value: "https://documed.health"
      - key: MONTHLY_PRICE_EGP
        value: "1500"
      # ── Secrets (set in dashboard, must match the web service) ──
      - key: DATABASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: EMAIL_BACKEND
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: INSTAPAY_ADDRESS
        sync: false

  # Weekly retention purge: permanently deletes data for clinics whose access
  # ended more than 90 days ago (honors the Privacy Policy / Terms retention
  # window). Runs with --commit. Monday 08:00 UTC. Needs DB + R2 (to delete
  # stored files) + email (owner summary). Destructive — keep an eye on its logs.
  - type: cron
    name: documed-retention-purge
    runtime: python
    schedule: "0 8 * * 1"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py purge_cancelled_clinics --commit
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      # ── Secrets (set in dashboard, must match the web service) ──
      - key: DATABASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: EMAIL_BACKEND
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: PAYMENT_NOTIFICATION_EMAIL
        sync: false
      # R2 — required so deleted clinics' uploaded files are removed from storage
      - key: R2_BUCKET_NAME
        value: "documed-media"
      - key: R2_ACCOUNT_ID
        value: "8bbcd32aedca41ce63e50d2c581b7794"
      - key: R2_ENDPOINT_URL
        value: "https://8bbcd32aedca41ce63e50d2c581b7794.r2.cloudflarestorage.com"
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
