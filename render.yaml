services:
  - type: web
    name: documed
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py compilemessages && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,www.documed.health,documed.health"
      - key: DATABASE_URL
        fromDatabase:
          name: documed-db
          property: connectionString
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://clinic-records.onrender.com,https://www.documed.health,https://documed.health"
      - key: R2_BUCKET_NAME
        value: "documed-media"
      - key: R2_ACCOUNT_ID
        value: "8bbcd32aedca41ce63e50d2c581b7794"
      - key: R2_ENDPOINT_URL
        value: "https://8bbcd32aedca41ce63e50d2c581b7794.r2.cloudflarestorage.com"
      - key: R2_ACCESS_KEY_ID
        sync: false   # set manually in Render dashboard
      - key: R2_SECRET_ACCESS_KEY
        sync: false   # set manually in Render dashboard

  # Daily renewal-reminder emails (3 days before + on the day access ends).
  # 07:00 UTC ≈ 09:00 in Egypt (UTC+2). Adjust if Egypt is on DST (UTC+3).
  # NOTE: this cron must have the SAME env vars as the web service. Any var you
  # set only in the dashboard (EMAIL_*, INSTAPAY_ADDRESS, SITE_URL, the real
  # DATABASE_URL, etc.) must also be added to this cron job, easiest via a
  # shared Env Group in the Render dashboard.
  - type: cron
    name: documed-renewal-reminders
    runtime: python
    schedule: "0 7 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py send_renewal_reminders
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: documed-db
          property: connectionString
      - key: SITE_URL
        value: "https://documed.health"

databases:
  - name: documed-db
    databaseName: documed
    user: documed
    plan: free
